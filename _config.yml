title: SEE Research Group
description: Software Engineering and Education (SEE) Research Group at Mid Sweden University (MIUN)

url: "https://seegroup.github.io"
baseurl: ""  # Empty for organization/user pages (requires repo name: seegroup.github.io)

markdown: kramdown

collections:
  people:
    output: true
    permalink: /people/:name/
  news:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Dokument som bara är instruktioner till en agent, inte sidor på webbplatsen.
# De innehåller Liquid-exempel som annars körs som kod när Jekyll bygger.
exclude:
  - cursor_agent_instruction_miun_inspired_site.md
  - BRIEF-regional-tech-kalender.md
  - notes.txt
  - vendor/
  - Gemfile
  - Gemfile.lock
  - download_profile_images.rb
